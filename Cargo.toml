[workspace]
resolver = "3"
members = ["crates/thodu-core", "crates/thodud", "crates/thodu"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[workspace.dependencies]
thodu-core = { path = "crates/thodu-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }
proptest = "1.12.0"
zbus = { version = "5.19.0", default-features = false, features = ["blocking-api", "async-io"] }
wayland-client = "0.31.15"
evdev = "0.13.2"
futures-lite = "2.6.1"
futures-util = { version = "0.3.34", default-features = false, features = ["std", "async-await", "async-await-macro"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
png = "0.17.16"
woints-core = { git = "https://github.com/wochap/woints.git", rev = "427ad6ada86253d7d12c2517d2649a11b97b8080" }
woints-vision = { git = "https://github.com/wochap/woints.git", rev = "427ad6ada86253d7d12c2517d2649a11b97b8080" }
