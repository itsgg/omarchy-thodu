# The full gate on a clean machine. It reports; the local gate and tools/land
# are what block a merge.
name: gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: The gate
        env:
          GATE_CI: "1"
          # A push checks each commit it adds; a pull request, each commit past its target.
          GATE_BASE: ${{ github.event.before }}
        run: tools/gate
