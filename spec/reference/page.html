<!doctype html>
<!-- The Chromium and Electron reference page (change 0001): the widgets of
     gtk3.py as HTML, for recording trees and checking clicks. A click shows
     in the title and the log below. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Thodu page reference</title>
<style>
  body { font: 16px sans-serif; margin: 16px; display: flex; flex-direction: column; gap: 8px; max-width: 480px; }
  button, input, select { font: inherit; padding: 6px; }
</style>
</head>
<body>
<button id="open">Open</button>
<button id="save">Save</button>
<button id="close">Close</button>
<button id="hidden" hidden>Hidden</button>
<input id="search" placeholder="Search" aria-label="Search">
<label><input id="remember" type="checkbox"> Remember</label>
<select id="size" aria-label="Size"><option>Small</option><option>Medium</option><option>Large</option></select>
<a id="docs" href="#docs">Docs</a>
<div id="log" aria-live="polite"></div>
<script>
  const log = (what) => { document.title = what; document.getElementById("log").textContent = what; };
  for (const b of document.querySelectorAll("button")) b.addEventListener("click", () => log("clicked " + b.textContent));
  document.getElementById("docs").addEventListener("click", (e) => { e.preventDefault(); log("clicked Docs"); });
  document.getElementById("search").addEventListener("input", (e) => log("typed " + e.target.value));
</script>
</body>
</html>
