# Reviewers for tools/review, in order of preference, as family:reviewer. A
# change is reviewed by the first whose family is not its author's. This file
# is the one place a reviewer or a model is named.
REVIEWERS="openai:cursor google:agy anthropic:claude"
CURSOR_MODEL=gpt-5.6-sol-high
# Seconds one review attempt may take; three failed attempts move to the next family.
REVIEW_TIMEOUT=1500
