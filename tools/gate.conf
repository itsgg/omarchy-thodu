# The gate's settings, read by tools/gate (as shell) and tools/checks.py. The
# template owns this file; put this project's own settings in
# tools/gate.local.conf, which is read after it and never updated.
PROJECT=thodu
STACKS="rust qml"
SUBJECT_STYLE=conventional
# Seconds each tier may take before the gate warns that it is over budget.
TURN_BUDGET=60
FULL_BUDGET=600
NIGHTLY_BUDGET=3600
AGENTS_MD_MAX_LINES=150
